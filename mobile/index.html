<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/m/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/m/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Co-Team</title>
    <script>
      // 防误触缩放（iOS Safari 10+ 忽略 user-scalable=no，需要三件套配合）：
      // 1) 多指捏合阻断（gesturestart 为 iOS 专有事件）；2) 双击缩放由 CSS touch-action: manipulation 禁；
      // 3) touchend 非 passive 监听——iOS 检测到页面接管手势后会让 user-scalable=no 生效（含输入聚焦自动放大）。
      (function () {
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        document.addEventListener('touchend', function () {}, { passive: false });
      })();
    </script>
    <style>
      /* 首屏骨架：JS 加载期间白屏体感消除（Vue 挂载后自动替换 #app 内容） */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: #0c0d10; color: #626a76; font: 13px/1.6 -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #boot .b { text-align: center; }
      #boot .b i { display: block; width: 26px; height: 26px; margin: 0 auto 10px; border-radius: 50%;
                   border: 3px solid #23272f; border-top-color: #ff9349; animation: bootspin 0.9s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><div class="b"><i></i>co-team</div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
