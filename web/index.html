<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Co-Team - 多Agent协作平台</title>
  <style>
    /* 首屏骨架：JS 加载期间的白屏/黑屏体感消除（Vue 挂载后自动替换 #app 内容） */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #0b0c0e; color: #666b75; font: 13px/1.6 -apple-system, 'Segoe UI', Roboto, sans-serif; }
    html.light #boot, body:not(.dark) #boot { background: #f5f6f8; }
    #boot .b { text-align: center; }
    #boot .b i { display: block; width: 28px; height: 28px; margin: 0 auto 10px; border-radius: 50%;
                 border: 3px solid #26272c; border-top-color: #4a8dff; animation: bootspin 0.9s linear infinite; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div id="boot"><div class="b"><i></i>co-team 启动中…</div></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
