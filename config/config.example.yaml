agents_dir: ./agents
dashboard:
  # SEC-P0：0.0.0.0（局域网可访问）时强烈建议配置 token——web/mobile 设置里填同一值即可通过门禁
  host: 0.0.0.0
  port: 8855
  # token: 长随机字符串（如 openssl rand -hex 24 生成）
model_pool:
  # 混合推理模型（Qwen3 系）可加 chat_template_kwargs: {enable_thinking: false} 关闭思考——
  # E17 实测思考可耗尽整个输出预算导致正文空假性失败；编排/结构化输出场景关闭更稳
  - id: rhythm/deepseek-v4-flash
    api_key: sk_your_api_key_here
    base_url: https://tokenrhythm.studio/v1
    concurrency: 4
    cost_per_1k: 0.005
    name: deepseek-v4-flash
    max_tokens: 128000
    context_length: 128000
    priority: 6
    professional_weight: 80
    provider: rhythm
    tags:
      - code
      - logic
      - review
  - id: rhythm/glm-5.3-flash
    api_key: sk_your_api_key_here
    base_url: https://tokenrhythm.studio/v1
    concurrency: 4
    cost_per_1k: 0.004
    name: glm-5.3-flash
    max_tokens: 128000
    context_length: 200000
    priority: 6
    professional_weight: 70
    provider: rhythm
    tags:
      - code
      - debug
  - id: local/qwen3.6
    name: qwen3.6
    max_tokens: 128000
    context_length: 256000
    provider: local-vllm   # 供应商名称（必填，用户填写）：下拉展示 name · provider，同名模型靠它区分
    api_key: '12345'
    base_url: http://192.168.1.237:8001/v1
    concurrency: 4
    priority: 1
    professional_weight: 90
    cost_per_1k: 0
    tags: []
  # 视觉模型（多模态旁路，可选）：tags 带 image 即可被 screenshot/look_image 工具定点调度
  # （UI 测试的视觉辅助手段，Playwright E2E 仍是主门槛）。未配置时工具返回软错误并降级为
  # check_page 文本验证 + 报告注明"需人工复核"，不影响任务主线。
  # - name: qwen2.5-vl-72b-instruct
  #   provider: local-vllm   # 必填
  #   api_key: sk_your_api_key_here
  #   base_url: https://your-openai-compatible-endpoint/v1
  #   concurrency: 2
  #   priority: 20
  #   professional_weight: 50
  #   cost_per_1k: 0
  #   max_tokens: 8192
  #   context_length: 32768
#   tags:
#     - image
# feature: 模型标签模板（可选）——用户自定义命名标签组合，设置界面「管理模板」可视化维护，
# 模型池模型行的「模板」下拉一键应用；此处仅作手改示例，推荐走 UI
# model_tag_templates:
#   - name: 视觉+推理
#     tags: [image, reasoning]
#   - name: 代码开发
#     tags: [code, debug, review]
orchestrator:
  max_retries: 3
  model: deepseek-v4-flash
  sandbox: true
  git: true
  branch_workflow: true
  max_fix_rounds: 3
  # 降级策略：模型池全忙/冷却时，dispatch 等待容量的最长时间（秒）；超时后突破冷却取最高优先级模型
  model_wait_timeout_sec: 120
  # 实施前澄清全局默认：off（关闭）/ brief（实施简报+确认，推荐）/ confirm（逐步确认）
  node_clarify: off
  # P0-1 自修改门禁：workspace 指向 co-team 本仓库的任务（自指任务）
  #  - 节点完成前强制运行 test_command，失败进入修复循环，超 max_fix_rounds 判节点失败
  #  - 节点改动触及 meta_paths 中的元设施路径时挂起等待人工审批
  self_mod_gate:
    enabled: true
    test_command: npm test
    timeout_sec: 600
    meta_paths:
      - server/src/harness.ts
      - server/src/skills.ts
      - server/src/deliverable.ts
      - server/src/orchestrator/
      - skills/
      - agents/
  # M2 全员实时问答：agent 可用 ask_user/ask_agent 发起阻塞式提问（回答到达前节点挂起等待，
  # 超时后按假设继续并在 result.assumptions 留痕）。0 以下视为非法，强制回缺省。
  ask_timeout_sec: 900
  # M3 监督者：事件驱动 + 周期心跳的有边界处置（催办/汇报/建议），改图类动作只生成提案待人工批准
  supervisor:
    enabled: true
    heartbeat_sec: 600      # 心跳评估周期（秒）；0 = 关闭心跳仅事件驱动
    min_interval_sec: 120   # 同任务同原因的最小评估间隔（防自激）
    milestone_notify: false # 2.4 中程里程碑通知：每节点完成即推 notify（飞书/webhook/移动端）
  # M4 滚动规划：rolling（缺省）= 按阶段滚动生成子图+全局验收清单，阶段闸门三出口；
  # static = 一次性整图（旧行为回退）。rolling_max_stages 防打转，达上限转人工。
  planning_mode: rolling
  rolling_max_stages: 5
  # 永续开发（2026-09-15）：基础设施类失败（模型 429/断链/上下文超限/服务重启）不锁车道，
  # 按 1min/5min/15min 递增延时自动重排；content 类失败（前置缺失/测试修不动）仍直接停靠人工。
  # 达到上限仍失败才锁车道等人工恢复。
  auto_requeue_max: 3
# LLM 超时语义重做（2026-09-09，i6efv5h2 复盘）：时长本身不构成失败——
# 只有 ①连接错误/流无 finish_reason 提前结束 ②持续静默（真停滞）③人工终止 才中止调用。
# 慢但在吐字的大上下文请求永不被误杀（旧 600s 总超时把"活着生成"当"停滞"绞死）。
# agent.yaml 的 timeout 字段语义同步变为"节点级总时长预算"：超线节点停靠人工，不记模型失败。
llm:
  first_token_idle_sec: 900   # 请求发出→首个数据块的静默上限（覆盖大 prompt prefill）；0=关闭
  stream_idle_sec: 900        # 数据块之间静默上限，任意 chunk 刷新计时；0=关闭
  wallclock_cap_sec: 0        # 墙钟保险丝（默认关闭），仅想要自动故障转移的部署按需开启
  non_stream_timeout_sec: 900 # 非流式请求（COTEAM_LLM_STREAM=0）无进度信号，只能用总时长兜底
  slow_success_sec: 300       # 单轮成功但超该秒数 → 模型降权（slow），不记失败不冷却
  # 按节点复杂度的输出预算分档（模型 max_tokens 仅封顶）——替代过去每个请求无脑填入
  # 模型上限（128000）导致本地推理超额预留/完成时间无上界的问题；置 output_tiers: {} 关闭。
  # 注意：推理模型光「思考」就可能吃掉 2 万 token，预算过小会造成 finish_reason=length
  # 正文为空的假性失败（实测 Qwen3.6 在 16000 档频繁耗尽），重推理池可再上调
  output_tiers:
    simple: 8000
    normal: 32000
    complex: 64000
# 上下文预算（缓存优先裁剪）：固定注入全部指针化（技能索引+load_skill、目标摘要、目录树），
# 工具循环严格 append-only 保住推理服务的前缀缓存；仅当估算超预算时做一次性确定性折叠
context:
  max_prompt_tokens: 16000          # prompt 估算超线触发断崖折叠（每尝试至多一次）
  workspace_tree_max_chars: 1500    # 文件树注入预算
  goal_max_chars: 1500              # 全局目标注入上限（超出截断并指向 GLOBAL_GOAL.md）
# 群组讨论引擎 v2（2026-09-09）：群内成员可直接读项目文件、执行命令、小改代码并重启验证。
# 所有工具受目录监狱约束（越界绝对路径/.. 一律拒绝）；改动超过小改预算（3 文件/80 行）会被
# 引导走「生成方案 → 转项目开发」。0l7ybpte 实测教训：口头承诺杀不死问题，工具结果才是汇报依据。
discussion:
  # 群内执行/写文件的权限闸门（语义同 permissions，缺省 full = 项目目录内完全控制；
  # 收紧为 whitelist_auto 时按 whitelist_commands 的 bin 名单放行，readonly 只留侦查）
  permissions:
    level: full
    # whitelist_commands: [npm, node, git, netstat]
    allow_sensitive: false  # 2026-09-19 起已无实际作用：可配置敏感命令（rm/python -c/git push 等）
                            # 在任务管线与群聊全放行；仅绝对禁止命令（sudo/schtasks/vssadmin 等）任何配置下拦截
  max_rounds: 3                     # 一条用户消息最多驱动的讨论轮数（含轮内插话重启）
  project_context_char_cap: 24000   # 项目背景+全量经验注入的字符预算（超出按最旧经验省略并显式标注）
knowledge:
  dir: ./data/knowledge
  # RAG 语义检索：指向模型池中支持 /v1/embeddings 的条目；未启用时回退关键词检索
  # embedding:
  #   enabled: true
  #   model: text-embedding-model   # 模型池条目名，该条目 roles 建议标注 ['embedding']
  # 治理：GET /api/knowledge?stale=1 列出超过该天数未更新的过期候选
  stale_days: 90
# 飞书 bot（事件订阅模式）：在飞书开放平台创建自建应用后启用。
# 密钥只走环境变量，禁止写入本文件：
#   COTEAM_FEISHU_APP_ID / COTEAM_FEISHU_APP_SECRET
#   COTEAM_FEISHU_VERIFICATION_TOKEN / COTEAM_FEISHU_ENCRYPT_KEY
# 回调地址: http://<host>:8855/api/feishu/webhook （需局域网/公网可达）
# feishu:
#   app_id: cli_xxx        # 也可由环境变量提供
#   app_secret: ""
#   verification_token: ""
#   encrypt_key: ""
permissions:
  # 命令执行分级：plan_only（只出方案不写代码）/ readonly（只读）/
  # approve_required（白名单外命令需人工审批，默认）/ whitelist_auto（白名单自动，其余拒绝）/
  # full（项目目录内完全控制——目录监狱对所有级别生效：命令中的越界绝对路径/`..` 一律拒绝）
  level: approve_required
  whitelist_commands:
    - python
    - pip
    - git
    - npm
    - node
    - mkdir
    - cp
    - mv
    - rm
    - ls
    - cat
    - chmod
# 每日问题报告：开启后每天在指定时刻把运行中的报错与功能性问题汇总报告给用户，
# 由用户决定是否转为修复任务（默认关闭，可在界面 设置 → 通用 中开关）
daily_report:
  enabled: false
  hour: 9
# 项目治理：项目拥有独立目录+独立 git 仓库；任务 workspace 落在其他仓库（含 co-team）
# 工作树内会被拒绝；自指任务（co-team 开发 co-team）在 selfdev_root 的本地克隆中隔离执行
projects:
  root: ./../projects        # 缺省 = co-team 仓库同级的 projects 目录；新建项目默认 <root>/<项目名slug>
  # selfdev_root: <root>/co-team-selfdev   # 缺省即如此，可覆盖
redis:
  db: 0
  host: 127.0.0.1
  port: 6379
  # SEC-P0：Redis 暴露非 127.0.0.1 时必须设密码（requirepass），co-team 连接同步配置此项
  # password: your-redis-password
# 外部 MCP 服务接入（MCP client）：把外部工具以 mcp__<name>__<tool> 暴露给 Agent。
# server 连接参数在这里配置；agent 可见性在 agents/<name>/agent.yaml 的 mcp_servers 白名单（默认不可见）。
# 密钥不进本文件：env/headers 的值支持 ${ENV_VAR} 占位（如 ${COTEAM_MCP_GITHUB_TOKEN}），
# 保存即热生效（设置界面 → MCP服务，或 PUT /api/config/mcp）。
# mcp:
#   servers:
#     - name: fs                      # 全小写 kebab，agent.yaml 用此名引用
#       type: stdio                   # stdio=本地命令进程 | http=Streamable HTTP 远程
#       enabled: true
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/pxx/projects"]
#       # env: { SOME_VAR: "${SOME_SECRET}" }
#       # timeout_sec: 60             # 单次调用超时（秒，缺省 60）
#       # max_result_chars: 16000     # 单次结果截断（字符，缺省 16000）
#     - name: github
#       type: http
#       url: "http://127.0.0.1:8931/mcp"
#       # headers: { Authorization: "Bearer ${COTEAM_MCP_GITHUB_TOKEN}" }
#       # allow_tools: []             # 工具级白名单（小写），空=全部
# 协作会话（convo）：单 agent 长对话直接操作项目工作区（/convo 页面）。
# 全部可省——缺省权限继承全局 permissions，命令超时 180s，工具循环 ≤15 轮，提问等待 1h。
# convo:
#   permissions:                 # 会话级权限缺省（可被单个会话的 policy_level 覆盖）
#     level: whitelist_auto
#     whitelist_commands: [python, pip, git, npm, node, mkdir, cp, mv, rm, ls, cat, chmod]
#     allow_sensitive: false     # true 时敏感命令（rm/git push 等）不再强制审批
#   exec_timeout_sec: 180        # 同步命令超时（秒）
#   max_tool_iter: 15            # 单轮 turn 工具迭代上限
#   ask_timeout_sec: 3600        # ask_user/命令审批 的等待上限（秒，超时按假设继续/拒绝）
#   auto_retry_count: 10         # 自动切换关时：主模型失败的同模型重试次数（默认 10）
#   auto_retry_base_ms: 1000     # 重试退避基数毫秒（指数 2^i 封顶 10×base）
