orchestrator:
  max_retries: 3
  model: deepseek-v4-flash
  sandbox: true
  git: true
  branch_workflow: true
  max_fix_rounds: 3
  # 降级策略：模型池全忙/冷却时，dispatch 等待容量的最长时间（秒）；超时后突破冷却取最高优先级模型
  model_wait_timeout_sec: 120
  # 实施前澄清全局默认：off（关闭）/ brief（实施简报+确认，推荐）/ confirm（逐步确认）
  node_clarify: off
  # P0-1 自修改门禁：workspace 指向 co-team 本仓库的任务（自指任务）
  #  - 节点完成前强制运行 test_command，失败进入修复循环，超 max_fix_rounds 判节点失败
  #  - 节点改动触及 meta_paths 中的元设施路径时挂起等待人工审批
  self_mod_gate:
    enabled: true
    test_command: npm test
    timeout_sec: 600
    meta_paths:
      - server/src/harness.ts
      - server/src/skills.ts
      - server/src/deliverable.ts
      - server/src/orchestrator/
      - skills/
      - agents/
# LLM 超时语义重做（2026-09-09，i6efv5h2 复盘）：时长本身不构成失败——
# 只有 ①连接错误/流无 finish_reason 提前结束 ②持续静默（真停滞）③人工终止 才中止调用。
# 慢但在吐字的大上下文请求永不被误杀（旧 600s 总超时把"活着生成"当"停滞"绞死）。
# agent.yaml 的 timeout 字段语义同步变为"节点级总时长预算"：超线节点停靠人工，不记模型失败。
llm:
  first_token_idle_sec: 900   # 请求发出→首个数据块的静默上限（覆盖大 prompt prefill）；0=关闭
  stream_idle_sec: 900        # 数据块之间静默上限，任意 chunk 刷新计时；0=关闭
  wallclock_cap_sec: 0        # 墙钟保险丝（默认关闭），仅想要自动故障转移的部署按需开启
  non_stream_timeout_sec: 900 # 非流式请求（COTEAM_LLM_STREAM=0）无进度信号，只能用总时长兜底
  slow_success_sec: 300       # 单轮成功但超该秒数 → 模型降权（slow），不记失败不冷却
  # 按节点复杂度的输出预算分档（模型 max_tokens 仅封顶）——替代过去每个请求无脑填入
  # 模型上限（128000）导致本地推理超额预留/完成时间无上界的问题；置 output_tiers: {} 关闭。
  # 注意：推理模型光「思考」就可能吃掉 2 万 token，预算过小会造成 finish_reason=length
  # 正文为空的假性失败（实测 Qwen3.6 在 16000 档频繁耗尽），重推理池可再上调
  output_tiers:
    simple: 8000
    normal: 32000
    complex: 64000
# 上下文预算（缓存优先裁剪）：固定注入全部指针化（技能索引+load_skill、目标摘要、目录树），
# 工具循环严格 append-only 保住推理服务的前缀缓存；仅当估算超预算时做一次性确定性折叠
context:
  max_prompt_tokens: 16000          # prompt 估算超线触发断崖折叠（每尝试至多一次）
  workspace_tree_max_chars: 1500    # 文件树注入预算
  goal_max_chars: 1500              # 全局目标注入上限（超出截断并指向 GLOBAL_GOAL.md）
knowledge:
  dir: ./data/knowledge
  # RAG 语义检索：指向模型池中支持 /v1/embeddings 的条目；未启用时回退关键词检索
  # embedding:
  #   enabled: true
  #   model: text-embedding-model   # 模型池条目名，该条目 roles 建议标注 ['embedding']
  # 治理：GET /api/knowledge?stale=1 列出超过该天数未更新的过期候选
  stale_days: 90
# 飞书 bot（事件订阅模式）：在飞书开放平台创建自建应用后启用。
# 密钥只走环境变量，禁止写入本文件：
#   COTEAM_FEISHU_APP_ID / COTEAM_FEISHU_APP_SECRET
#   COTEAM_FEISHU_VERIFICATION_TOKEN / COTEAM_FEISHU_ENCRYPT_KEY
# 回调地址: http://<host>:8855/api/feishu/webhook （需局域网/公网可达）
# feishu:
#   app_id: cli_xxx        # 也可由环境变量提供
#   app_secret: ""
#   verification_token: ""
#   encrypt_key: ""
permissions:
  # 命令执行分级：plan_only（只出方案不写代码）/ readonly（只读）/
  # approve_required（白名单外命令需人工审批，默认）/ whitelist_auto（白名单自动，其余拒绝）/
  # full（项目目录内完全控制——目录监狱对所有级别生效：命令中的越界绝对路径/`..` 一律拒绝）
  level: approve_required
  whitelist_commands:
    - python
    - pip
    - git
    - npm
    - node
    - mkdir
    - cp
    - mv
    - rm
    - ls
    - cat
    - chmod
# 每日问题报告：开启后每天在指定时刻把运行中的报错与功能性问题汇总报告给用户，
# 由用户决定是否转为修复任务（默认关闭，可在界面 设置 → 通用 中开关）
daily_report:
  enabled: false
  hour: 9
# 项目治理：项目拥有独立目录+独立 git 仓库；任务 workspace 落在其他仓库（含 co-team）
# 工作树内会被拒绝；自指任务（co-team 开发 co-team）在 selfdev_root 的本地克隆中隔离执行
projects:
  root: ./../projects        # 缺省 = co-team 仓库同级的 projects 目录；新建项目默认 <root>/<项目名slug>
  # selfdev_root: <root>/co-team-selfdev   # 缺省即如此，可覆盖
redis:
  db: 0
  host: 127.0.0.1
  port: 6379
